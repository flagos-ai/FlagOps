name: "Run On-Demand Test"
description: >-
  Run an arbitrary test command, upload results as an artifact, and post (or
  update) a PR comment with the report. Generalized from FlagGems ondemand-test
  for org-wide reuse. Contains only bash and remote-action steps (no local ./
  refs), so it can be consumed via a fully-qualified @main ref from containerized
  runners where local ./ refs can't be resolved.

inputs:
  test-command:
    description: >-
      Shell command (or multi-line script) to execute. Must produce a report
      file at report-path and test artifacts at artifact-path when done.
    required: true
  report-path:
    description: "Path to the markdown report file generated by test-command"
    required: false
    default: "report.md"
  artifact-name:
    description: "Name for the uploaded results artifact"
    required: true
  artifact-path:
    description: "Path to upload as the results artifact"
    required: false
    default: "results/"
  comment-message-id:
    description: >-
      Stable ID for the PR comment. Using the same ID on subsequent runs
      updates the existing comment rather than creating a new one.
    required: true
  github-token:
    description: "Token used to post (or update) the PR comment on failure"
    required: true

runs:
  using: "composite"
  steps:
    - id: run-tests
      shell: bash
      run: ${{ inputs.test-command }}

    - id: upload-results
      uses: actions/upload-artifact@v7.0.1
      continue-on-error: true
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}

    - id: attach-result-link
      if: steps.upload-results.outcome == 'success'
      shell: bash
      run: |
        echo -e "\n---\n" >> ${{ inputs.report-path }}
        echo -e "📎 Download the full log [here](${{ steps.upload-results.outputs.artifact-url }})" >> ${{ inputs.report-path }}

    - id: comment
      uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59  # 3.12.0
      with:
        message-path: ${{ inputs.report-path }}
        message-id: ${{ inputs.comment-message-id }}
        allow-repeats: true

    - id: failure-report
      if: failure()
      uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59  # 3.12.0
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        message: |
          ## ❌ On-demand test failed

          **Artifact:** `${{ inputs.artifact-name }}`
          **Comment ID:** `${{ inputs.comment-message-id }}`

          The test failed to complete. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
        message-id: ${{ inputs.comment-message-id }}
