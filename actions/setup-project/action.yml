name: "Setup Project"
description: >-
  Run a project setup script for a given backend, optionally install vllm with
  layer-1 package integrity protection, and export available GPU IDs to
  AVAILABLE_GPUS. Generalized from FlagGems setup-flaggems for org-wide reuse.

inputs:
  backend:
    description: >-
      Backend label passed to the setup script (e.g. nvidia-cuda133,
      mthreads-musa520, ascend-cann900). Also used to decide whether vllm
      should be installed (see vllm-backend-prefix).
    required: true
  setup-script:
    description: "Path to the setup script to run"
    required: false
    default: "./setup.sh"
  vllm-version:
    description: >-
      vllm version to install (e.g. 0.21.0). Leave empty to skip vllm
      installation entirely.
    required: false
    default: ""
  vllm-backend-prefix:
    description: >-
      Only install vllm when inputs.backend starts with this prefix. Set to
      an empty string to install vllm unconditionally (when vllm-version is
      also set).
    required: false
    default: "nvidia"
  vllm-safe-deps-script:
    description: >-
      Path to a script that prints safe vllm transitive dependencies (those
      that won't downgrade layer-1 packages). Leave empty to skip safe-deps
      filtering — vllm will be installed with --no-deps only.
    required: false
    default: "tools/vllm_safe_deps.py"
  layer1-packages-pattern:
    description: >-
      Extended-regex pattern used to identify layer-1 packages in `uv pip
      freeze` output. A snapshot is taken before and after vllm install; if
      any matching package changes the step fails.
    required: false
    default: "^(torch|triton|flag)"
  gpu-check-script:
    description: >-
      Path to a GPU availability check script. When set, the script is run
      after setup and its output is parsed for a line matching
      "Available GPUs: <ids>" to populate the AVAILABLE_GPUS env var.
      Leave empty to skip the GPU check.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run setup script
      shell: bash
      run: ${{ inputs.setup-script }} ${{ inputs.backend }}

    - name: Install vllm
      # Run only when vllm-version is set AND backend matches the prefix.
      # An empty vllm-backend-prefix matches every backend (prefix of "").
      if: >-
        inputs.vllm-version != '' &&
        (inputs.vllm-backend-prefix == '' ||
         startsWith(inputs.backend, inputs.vllm-backend-prefix))
      shell: bash
      env:
        VLLM_VERSION: ${{ inputs.vllm-version }}
        LAYER1_PATTERN: ${{ inputs.layer1-packages-pattern }}
        SAFE_DEPS_SCRIPT: ${{ inputs.vllm-safe-deps-script }}
      run: |
        source .venv/bin/activate

        # Record layer-1 state before vllm install
        uv pip freeze | grep -iE "$LAYER1_PATTERN" | sort > /tmp/layer1-snapshot.txt

        # Install vllm without deps to avoid overwriting torch/triton/flagtree
        uv pip install --no-deps "vllm==${VLLM_VERSION}"

        # If a safe-deps script is provided, generate and install safe deps
        if [ -n "$SAFE_DEPS_SCRIPT" ] && [ -f "$SAFE_DEPS_SCRIPT" ]; then
          python3 "$SAFE_DEPS_SCRIPT" "vllm==${VLLM_VERSION}" > /tmp/vllm-safe-deps.txt
          uv pip install --no-deps -r /tmp/vllm-safe-deps.txt
        fi

        # Verify layer-1 packages were not modified
        uv pip freeze | grep -iE "$LAYER1_PATTERN" | sort > /tmp/layer2-snapshot.txt
        if ! diff -q /tmp/layer1-snapshot.txt /tmp/layer2-snapshot.txt > /dev/null 2>&1; then
          echo "::error::Layer 1 packages were modified by vllm install!"
          diff /tmp/layer1-snapshot.txt /tmp/layer2-snapshot.txt
          exit 1
        fi

    - name: Check GPU availability
      if: inputs.gpu-check-script != ''
      shell: bash
      run: |
        source .venv/bin/activate
        GPU_OUTPUT=$(bash ${{ inputs.gpu-check-script }})
        echo "$GPU_OUTPUT"
        AVAILABLE_GPUS=$(echo "$GPU_OUTPUT" | grep "^Available GPUs:" | cut -d: -f2 | tr -d ' ')
        echo "AVAILABLE_GPUS=${AVAILABLE_GPUS}" >> $GITHUB_ENV
